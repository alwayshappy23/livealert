<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stock Strategy Backtest</title>
<style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #0d1117;
        color: #c9d1d9;
        padding: 20px;
        max-width: 900px;
        margin: auto;
    }
    h1 { color: #58a6ff; }
    .controls {
        background: #161b22;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #30363d;
        margin-bottom: 20px;
    }
    .controls label {
        display: inline-block;
        margin: 8px 15px 8px 0;
    }
    input {
        background: #0d1117;
        color: #c9d1d9;
        border: 1px solid #30363d;
        padding: 6px 10px;
        border-radius: 4px;
        width: 80px;
        font-family: monospace;
    }
    button {
        background: #238636;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        margin-top: 10px;
    }
    button:hover { background: #2ea043; }
    .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
    }
    .stat {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 15px;
    }
    .stat .label { color: #8b949e; font-size: 12px; text-transform: uppercase; }
    .stat .value { font-size: 22px; font-weight: bold; margin-top: 5px; }
    .green { color: #3fb950; }
    .red   { color: #f85149; }
    pre {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 15px;
        overflow-x: auto;
        font-size: 13px;
        max-height: 400px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #30363d; }
    th { color: #8b949e; text-transform: uppercase; font-size: 11px; }
    .buy  { color: #3fb950; font-weight: bold; }
    .sell { color: #f85149; font-weight: bold; }
</style>
</head>
<body>

<h1>📈 SMA Crossover Backtest</h1>

<div class="controls">
    <label>Fast SMA: <input id="fast" type="number" value="10"></label>
    <label>Slow SMA: <input id="slow" type="number" value="30"></label>
    <label>Days: <input id="days" type="number" value="300"></label>
    <label>Start $: <input id="capital" type="number" value="10000"></label>
    <br>
    <button onclick="run()">🚀 Run Backtest</button>
</div>

<div class="stats" id="stats"></div>
<div id="trades"></div>

<script>
// ============================================
// 1. INDICATORS
// ============================================
function SMA(prices, period) {
    return prices.map((_, i) => {
        if (i < period - 1) return null;
        const slice = prices.slice(i - period + 1, i + 1);
        return slice.reduce((a, b) => a + b, 0) / period;
    });
}

// ============================================
// 2. GENERATE FAKE PRICE DATA
// ============================================
function generatePrices(n, start = 100) {
    const prices = [start];
    for (let i = 1; i < n; i++) {
        const change = (Math.random() - 0.48) * 2; // slight upward drift
        prices.push(Math.max(1, prices[i - 1] + change));
    }
    return prices;
}

// ============================================
// 3. BACKTEST
// ============================================
function backtest(prices, fastPeriod, slowPeriod, capital) {
    const fast = SMA(prices, fastPeriod);
    const slow = SMA(prices, slowPeriod);

    let cash = capital;
    let shares = 0;
    const trades = [];

    for (let i = 1; i < prices.length; i++) {
        if (fast[i] == null || slow[i] == null) continue;

        const buySignal  = fast[i - 1] <= slow[i - 1] && fast[i] > slow[i];
        const sellSignal = fast[i - 1] >= slow[i - 1] && fast[i] < slow[i];
        const price = prices[i];

        if (buySignal && shares === 0) {
            shares = Math.floor(cash / price);
            if (shares > 0) {
                cash -= shares * price;
                trades.push({ day: i, type: 'BUY', price, shares });
            }
        } else if (sellSignal && shares > 0) {
            cash += shares * price;
            trades.push({ day: i, type: 'SELL', price, shares });
            shares = 0;
        }
    }

    const finalValue  = cash + shares * prices[prices.length - 1];
    const buyHoldVal  = (capital / prices[0]) * prices[prices.length - 1];

    return {
        initialCapital: capital,
        finalValue,
        strategyReturn: (finalValue / capital - 1) * 100,
        buyHoldReturn:  (buyHoldVal / capital - 1) * 100,
        trades
    };
}

// ============================================
// 4. RENDER RESULTS
// ============================================
function formatMoney(n) {
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function colorClass(n) { return n >= 0 ? 'green' : 'red'; }

function render(result) {
    const statsEl = document.getElementById('stats');
    statsEl.innerHTML = `
        <div class="stat"><div class="label">Initial Capital</div><div class="value">${formatMoney(result.initialCapital)}</div></div>
        <div class="stat"><div class="label">Final Value</div><div class="value">${formatMoney(result.finalValue)}</div></div>
        <div class="stat"><div class="label">Strategy Return</div><div class="value ${colorClass(result.strategyReturn)}">${result.strategyReturn.toFixed(2)}%</div></div>
        <div class="stat"><div class="label">Buy & Hold</div><div class="value ${colorClass(result.buyHoldReturn)}">${result.buyHoldReturn.toFixed(2)}%</div></div>
        <div class="stat"><div class="label">Total Trades</div><div class="value">${result.trades.length}</div></div>
    `;

    const tradesEl = document.getElementById('trades');
    if (result.trades.length === 0) {
        tradesEl.innerHTML = '<pre>No trades were triggered. Try different periods.</pre>';
        return;
    }

    const rows = result.trades.map(t => `
        <tr>
            <td>${t.day}</td>
            <td class="${t.type === 'BUY' ? 'buy' : 'sell'}">${t.type}</td>
            <td>${formatMoney(t.price)}</td>
            <td>${t.shares}</td>
            <td>${formatMoney(t.price * t.shares)}</td>
        </tr>
    `).join('');

    tradesEl.innerHTML = `
        <h3>📋 Trade Log (${result.trades.length} trades)</h3>
        <table>
            <thead><tr><th>Day</th><th>Type</th><th>Price</th><th>Shares</th><th>Value</th></tr></thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

// ============================================
// 5. MAIN
// ============================================
function run() {
    const fast     = +document.getElementById('fast').value;
    const slow     = +document.getElementById('slow').value;
    const days     = +document.getElementById('days').value;
    const capital  = +document.getElementById('capital').value;

    if (fast >= slow) {
        alert('Fast period must be smaller than slow period.');
        return;
    }

    const prices = generatePrices(days, 100);
    const result = backtest(prices, fast, slow, capital);
    render(result);
}

// Auto-run on page load
run();
</script>

</body>
</html>
